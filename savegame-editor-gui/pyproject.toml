[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "savegame-editor-gui"
version = "0.9.4"
description = "Cross-engine save game editor with GUI — ingest, decode, patch, and re-emit save files for PC titles."
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "savegame-editor-gui contributors" }]
keywords = ["savegame", "save-editor", "modding", "cheat-engine", "gui", "pyqt6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]

dependencies = [
    "PyQt6>=6.7.0",          # GUI toolkit; QThread signals used by worker pool
    "pydantic>=2.7.0",       # schema validation for save profiles
    "lz4>=4.3.3",            # most Bethesda/UE saves use LZ4 block framing
    "zstandard>=0.22.0",     # UE5 .sav uses zlib or zstd depending on build
    "construct>=2.10.68",    # binary struct DSL for header parsing
    "pycryptodome>=3.20.0",  # AES-CBC for encrypted profile blobs
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-qt>=4.4", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
savegame-editor = "savegame_editor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["savegame_editor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"